<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="cushionClipLg">
      <rect x="32" y="32" width="448" height="448" rx="104" ry="104"/>
    </clipPath>
    <!-- The cushion-treemap technique itself: a per-cell radial highlight
         (bright near one corner, fading to a dark edge) that reads as a
         soft 3D "pillow" bump - van Wijk & van de Wetering's actual
         shading trick, not just decoration. Same recipe as icon.svg,
         just with room to be more generous about it at this size. -->
    <radialGradient id="bumpLg" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.22"/>
    </radialGradient>
    <radialGradient id="buttonShine" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="cushionShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- cushion base -->
  <rect x="32" y="32" width="448" height="448" rx="104" ry="104"
        fill="#f2f1ec" stroke="#0b0b0b" stroke-opacity="0.08" stroke-width="6"
        filter="url(#cushionShadow)"/>

  <!-- a squarified treemap, tiled exactly inside the cushion - seven
       cells this time (room for more detail at this size than the
       48/96px icon.svg needs), still laid out the way squarify() itself
       would actually pack rectangles of varying size. -->
  <g clip-path="url(#cushionClipLg)">
    <rect x="32"  y="32"  width="248" height="222" fill="#2a78d6"/>
    <rect x="280" y="32"  width="200" height="120" fill="#eb6834"/>
    <rect x="280" y="152" width="120" height="102" fill="#1baf7a"/>
    <rect x="400" y="152" width="80"  height="102" fill="#9085e9"/>
    <rect x="32"  y="254" width="180" height="226" fill="#e87ba4"/>
    <rect x="212" y="254" width="150" height="226" fill="#eda100"/>
    <rect x="362" y="254" width="118" height="226" fill="#4a3aa7"/>

    <rect x="32"  y="32"  width="248" height="222" fill="url(#bumpLg)"/>
    <rect x="280" y="32"  width="200" height="120" fill="url(#bumpLg)"/>
    <rect x="280" y="152" width="120" height="102" fill="url(#bumpLg)"/>
    <rect x="400" y="152" width="80"  height="102" fill="url(#bumpLg)"/>
    <rect x="32"  y="254" width="180" height="226" fill="url(#bumpLg)"/>
    <rect x="212" y="254" width="150" height="226" fill="url(#bumpLg)"/>
    <rect x="362" y="254" width="118" height="226" fill="url(#bumpLg)"/>

    <g stroke="#f2f1ec" stroke-width="7" stroke-linecap="round">
      <line x1="280" y1="32"  x2="280" y2="480"/>
      <line x1="280" y1="152" x2="480" y2="152"/>
      <line x1="400" y1="152" x2="400" y2="254"/>
      <line x1="32"  y1="254" x2="480" y2="254"/>
      <line x1="212" y1="254" x2="212" y2="480"/>
      <line x1="362" y1="254" x2="362" y2="480"/>
    </g>
  </g>

  <!-- quilted creases radiating from each tufted button - a real tufted
       cushion's diagonal fold lines, not just decoration on the buttons
       themselves -->
  <g stroke="#0b0b0b" stroke-opacity="0.10" stroke-width="3" fill="none">
    <path d="M 104 104 L 32 32 M 104 104 L 176 32 M 104 104 L 32 176"/>
    <path d="M 408 104 L 480 32 M 408 104 L 336 32 M 408 104 L 480 176"/>
    <path d="M 104 408 L 32 480 M 104 408 L 176 480 M 104 408 L 32 336"/>
    <path d="M 408 408 L 480 480 M 408 408 L 336 480 M 408 408 L 480 336"/>
  </g>

  <!-- tufted-cushion corner buttons - the unmistakable "this is a
       cushion" cue, each with its own small shine so they read as
       actual buttons rather than flat dots at this size -->
  <g>
    <circle cx="104" cy="104" r="15" fill="#0b0b0b" fill-opacity="0.4"/>
    <circle cx="408" cy="104" r="15" fill="#0b0b0b" fill-opacity="0.4"/>
    <circle cx="104" cy="408" r="15" fill="#0b0b0b" fill-opacity="0.4"/>
    <circle cx="408" cy="408" r="15" fill="#0b0b0b" fill-opacity="0.4"/>
    <circle cx="104" cy="104" r="15" fill="url(#buttonShine)"/>
    <circle cx="408" cy="104" r="15" fill="url(#buttonShine)"/>
    <circle cx="104" cy="408" r="15" fill="url(#buttonShine)"/>
    <circle cx="408" cy="408" r="15" fill="url(#buttonShine)"/>
  </g>
</svg>
