sonar.projectKey=cussijn-tree-view
sonar.projectName=Cussijn Tree View

sonar.sources=extension
sonar.exclusions=**/*.test.js
sonar.tests=extension
sonar.test.inclusions=**/*.test.js

# Written by build/sonar.sh (node --test with the lcov reporter).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8

# Findings that are deliberate, not defects:
#   S2486 - the catch blocks ignore the error on purpose: a missing cache,
#     a closed tab, or no open mail tab each has a defined fallback.
#   S3735 - `void browser.runtime.lastError` is what marks the harmless
#     "duplicate id" from menus.create() as handled.
#   S7758 - hashColor() must keep producing the same color for the same
#     domain across versions; codePointAt would change it for non-BMP text.
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S2486
sonar.issue.ignore.multicriteria.e1.resourceKey=extension/**
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S3735
sonar.issue.ignore.multicriteria.e2.resourceKey=extension/background.js
sonar.issue.ignore.multicriteria.e3.ruleKey=javascript:S7758
sonar.issue.ignore.multicriteria.e3.resourceKey=extension/cussijn.js
