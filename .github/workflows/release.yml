name: Release

# major/minor/bugfix versioning, signalled either way (both are checked,
# label wins if both are present): a PR label named "major"/"minor"/
# "bugfix", or the PR title starting with "major:"/"minor:"/"bugfix:"
# (equivalently "patch:") - no Conventional Commits vocabulary
# (feat/fix/"!") anywhere in this repo's own process.
#
# Two automatic hops through this SAME workflow, both triggered by "a PR
# merged into main", told apart by the merged branch's name - and ONE
# deliberate manual click in between (merging the small PR hop 1 opens).
# Two designs were tried and rejected before this one, both live against
# this repo's actual first release:
#   - A single commit pushed straight to main using a personal access
#     token (bypassing "require a pull request" via admin exemption) -
#     works, but means a PAT with write access to the repo has to live
#     in Actions secrets. Asked, and the answer was no - a stored
#     credential that powerful is a real, reasonable thing to not want,
#     not a "just trust it" call to overrule.
#   - Fully auto-merging the release/* PR with GITHUB_TOKEN (no PAT
#     needed for THAT part) - but a GITHUB_TOKEN-driven merge doesn't
#     trigger further workflow runs (GitHub's anti-recursion
#     protection), so hop 2 (the actual tag + release) silently never
#     fired at all.
# This version keeps GITHUB_TOKEN only (no new secret) and keeps hop 1
# open a PR, but does NOT auto-merge it - a human merging it (via the
# GitHub UI, or by asking Claude to do it through its own authenticated
# session, not a workflow's GITHUB_TOKEN) is a REAL user action, which
# both sidesteps the anti-recursion limit AND is a legitimate checkpoint
# before anything reaches the Thunderbird store, not just a workaround.
#
#   1. A real PR merges (any branch not named release/*) - reads its
#      label/title for a bump type, computes the next version from the
#      latest vX.Y.Z tag, and opens a "release/vX.Y.Z" PR bumping
#      extension/manifest.json's version and adding a CHANGELOG.md
#      entry. Note: GitHub sometimes holds this PR's own CI run for
#      manual "action_required" approval, since it's a github-actions[bot]
#      -authored branch - approve it (Actions tab, or
#      `gh api -X POST .../actions/runs/<id>/approve`) same as you'd
#      review the PR itself.
#   2. A human merges that release/* PR - THIS is what tags the repo and
#      publishes a GitHub Release, which is what actually triggers
#      publish-thunderbird.yml. Recognized purely by branch name
#      (startsWith(..., 'release/')), not by anything in its title/label.
#
# A PR with none of major/minor/bugfix on it (docs, CI tweaks, a
# Dependabot bump) merges normally and cuts no release at all.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Cut the tag + GitHub Release (hop 2 - a human just merged a release/* PR)
        if: startsWith(github.event.pull_request.head.ref, 'release/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # An annotated tag needs a committer identity - missing here
          # (only the OTHER step, hop 1's PR-opening one, set this)
          # failed v1.0.1's automated tag/release outright: "fatal: empty
          # ident name". Found live, fixed once, not theorized.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          version=$(jq -r .version extension/manifest.json)
          tag="v${version}"
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"
          gh release create "$tag" \
            --title "$tag" \
            --notes "Released from #${{ github.event.pull_request.number }}. See CHANGELOG.md."

      - name: Determine bump type (hop 1 - a real PR just merged)
        if: ${{ !startsWith(github.event.pull_request.head.ref, 'release/') }}
        id: bump
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          type=""
          for want in major minor bugfix; do
            if echo ",$PR_LABELS," | grep -qi ",$want,"; then type="$want"; break; fi
          done
          if [ -z "$type" ]; then
            shopt -s nocasematch
            case "$PR_TITLE" in
              major:*) type="major" ;;
              minor:*) type="minor" ;;
              bugfix:*|patch:*) type="bugfix" ;;
            esac
          fi
          echo "type=$type" >> "$GITHUB_OUTPUT"
          if [ -z "$type" ]; then
            echo "No major/minor/bugfix label or title prefix on #${{ github.event.pull_request.number }} - not cutting a release."
          fi

      - name: Compute next version
        if: steps.bump.outputs.type != ''
        id: version
        run: |
          last_tag=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          last_tag=${last_tag:-v0.0.0}
          IFS='.' read -r major minor patch <<< "${last_tag#v}"
          case "${{ steps.bump.outputs.type }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            bugfix) patch=$((patch + 1)) ;;
          esac
          echo "version=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"

      - name: Open the release bump PR (NOT auto-merged - see comment at top of this file)
        if: steps.bump.outputs.type != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          BUMP_TYPE: ${{ steps.bump.outputs.type }}
          SOURCE_PR: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch="release/v${VERSION}"
          git checkout -b "$branch"

          python3 - <<'PYEOF'
          import json, os

          version = os.environ["VERSION"]
          bump_type = os.environ["BUMP_TYPE"]
          source_pr = os.environ["SOURCE_PR"]

          with open("extension/manifest.json") as f:
              manifest = json.load(f)
          manifest["version"] = version
          with open("extension/manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")

          entry = f"## v{version} - {bump_type}\n\nFrom #{source_pr}.\n\n"
          try:
              with open("CHANGELOG.md") as f:
                  existing = f.read()
          except FileNotFoundError:
              existing = "# Changelog\n\n"
          header, _, rest = existing.partition("\n\n")
          with open("CHANGELOG.md", "w") as f:
              f.write(header + "\n\n" + entry + rest)
          PYEOF

          git add extension/manifest.json CHANGELOG.md
          git commit -m "chore(release): v${VERSION}"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(release): v${VERSION}" \
            --body "Automated ${BUMP_TYPE} bump to v${VERSION}, triggered by #${SOURCE_PR}. **Merge this PR yourself when ready** - that's what actually tags the release and publishes it to Thunderbird Add-ons (see the comment at the top of release.yml for why this step is manual)."
