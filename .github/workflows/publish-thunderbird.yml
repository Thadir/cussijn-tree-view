name: Publish to Thunderbird Add-ons

# Fires when release.yml's hop 2 cuts an actual GitHub Release (tagging
# a merged release/vX.Y.Z PR - see the comment at the top of release.yml).
# Builds the .xpi from that release's exact tagged commit, attaches it to
# the GitHub Release as a downloadable asset, then signs and submits it
# to addons.thunderbird.net (ATN) for review via web-ext, using the
# kewisch/action-web-ext action (maintained by a Thunderbird add-ons
# contributor, and the one actually aware of ATN's API quirks).
#
# Also takes a manual workflow_dispatch with a `tag` input, as a fallback:
# a release created by release.yml's own hop 2 uses GITHUB_TOKEN, and
# GitHub's anti-recursion protection means a GITHUB_TOKEN-authored
# `release: published` event does not reliably trigger other workflows -
# found live, the same limitation release.yml's own comment already
# documents for a GITHUB_TOKEN-driven PR merge. When that happens, a
# human (or Claude, via its own authenticated `gh` session - a real user
# action, not a workflow's GITHUB_TOKEN) can fire this workflow directly:
# `gh workflow run publish-thunderbird.yml -f tag=vX.Y.Z`.
#
# ATN runs its own instance of the addons-server codebase, separate from
# addons.mozilla.org, still on the older v4 API (not AMO's v5) and with a
# smaller metadata surface - hence the explicit apiUrlPrefix below rather
# than the action's AMO-pointed default.
#
# Requires two repo secrets, neither of which this pipeline can generate
# on its own - see the "Publishing to Thunderbird Add-ons" section in
# README.md for how to get them:
#   ATN_API_KEY, ATN_API_SECRET  - from your addons.thunderbird.net
#   developer account's API keys page.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.0.0) - only needed when the automatic trigger above didn't fire"
        required: true

permissions:
  contents: write

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Ensure zip is available
        run: command -v zip >/dev/null || (sudo apt-get update && sudo apt-get install -y zip)

      - name: Build & test
        run: ./build/build.sh

      - name: Attach .xpi to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" dist/cussijn-tree-view.xpi --clobber

      - name: Lint before submitting
        uses: kewisch/action-web-ext@v2
        with:
          cmd: lint
          source: dist/cussijn-tree-view.xpi

      - name: Sign & submit to addons.thunderbird.net
        uses: kewisch/action-web-ext@v2
        with:
          cmd: sign
          channel: listed
          source: dist/cussijn-tree-view.xpi
          apiUrlPrefix: https://addons.thunderbird.net/api/v4
          apiKey: ${{ secrets.ATN_API_KEY }}
          apiSecret: ${{ secrets.ATN_API_SECRET }}
