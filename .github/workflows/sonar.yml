name: SonarQube

# Code-quality scan against a throwaway SonarQube Community container that
# build/sonar.sh starts on the runner - the same script `./build/sonar.sh`
# runs locally under podman. Kept out of ci.yml on purpose: "test" there is
# the required status check, and this scan is report-only and must never be
# able to block a merge. The server is discarded with the runner, so there's
# no dashboard to browse here; the result is in the job summary.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sonar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Scan
        env:
          CONTAINER_ENGINE: docker
        run: ./build/sonar.sh

      - name: Remove the server container
        if: always()
        env:
          CONTAINER_ENGINE: docker
        run: ./build/sonar.sh stop
