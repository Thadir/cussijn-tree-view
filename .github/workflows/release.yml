name: Release

# major/minor/bugfix versioning, signalled either way (both are checked,
# label wins if both are present): a PR label named "major"/"minor"/
# "bugfix", or the PR title starting with "major:"/"minor:"/"bugfix:"
# (equivalently "patch:") - no Conventional Commits vocabulary
# (feat/fix/"!") anywhere in this repo's own process.
#
# ONE commit straight to main, no branch/PR for the version bump - an
# earlier version of this workflow used a second "release/vX.Y.Z" PR
# (branch protection blocks a direct push to main from the built-in
# GITHUB_TOKEN), and hit three real problems live on this repo's actual
# first release:
#   1. GITHUB_TOKEN-driven pushes don't trigger further workflow runs
#      (GitHub's anti-recursion protection) - so the PR merging never
#      fired the next step at all, silently.
#   2. GitHub required manual "action_required" approval before CI would
#      even run on that bot-opened PR.
#   3. Branch protection's "require branch up to date" kept marking that
#      PR stale (BEHIND) every time an unrelated PR (a Dependabot bump)
#      merged first, needing a manual re-sync.
# All three go away by pushing with a real user token instead: this
# repo's owner is an admin, and branch protection has
# enforce_admins: false, so an authenticated push as an actual admin
# user bypasses "require a pull request before merging" for this one,
# narrowly-scoped, machine-generated commit - and being a real token
# (not GITHUB_TOKEN), it triggers ci.yml and publish-thunderbird.yml
# normally, no anti-recursion limit. Needs a repo secret only a human
# can create - see README's "Continuous integration & releases" for how.
#
# Deliberate tradeoff, not an oversight: this bump commit lands on main
# BEFORE its own CI result is known (there's nothing left to gate it on
# - no PR, no required check). Acceptable here because the commit is
# entirely generated (a version string + a changelog entry, nothing
# hand-written) and the actual feature/fix content it's releasing
# already passed CI as its own separate, real PR.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
          # A real admin PAT, not the default GITHUB_TOKEN - see the
          # comment above for why. persist-credentials keeps it as the
          # remote's auth for the `git push` below.
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Determine bump type
        id: bump
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          type=""
          for want in major minor bugfix; do
            if echo ",$PR_LABELS," | grep -qi ",$want,"; then type="$want"; break; fi
          done
          if [ -z "$type" ]; then
            shopt -s nocasematch
            case "$PR_TITLE" in
              major:*) type="major" ;;
              minor:*) type="minor" ;;
              bugfix:*|patch:*) type="bugfix" ;;
            esac
          fi
          echo "type=$type" >> "$GITHUB_OUTPUT"
          if [ -z "$type" ]; then
            echo "No major/minor/bugfix label or title prefix on #${{ github.event.pull_request.number }} - not cutting a release."
          fi

      - name: Compute next version
        if: steps.bump.outputs.type != ''
        id: version
        run: |
          last_tag=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          last_tag=${last_tag:-v0.0.0}
          IFS='.' read -r major minor patch <<< "${last_tag#v}"
          case "${{ steps.bump.outputs.type }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            bugfix) patch=$((patch + 1)) ;;
          esac
          echo "version=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"

      - name: Bump manifest.json + CHANGELOG.md, commit, tag, push to main
        if: steps.bump.outputs.type != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          BUMP_TYPE: ${{ steps.bump.outputs.type }}
          SOURCE_PR: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          python3 - <<'PYEOF'
          import json, os

          version = os.environ["VERSION"]
          bump_type = os.environ["BUMP_TYPE"]
          source_pr = os.environ["SOURCE_PR"]

          with open("extension/manifest.json") as f:
              manifest = json.load(f)
          manifest["version"] = version
          with open("extension/manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")

          entry = f"## v{version} - {bump_type}\n\nFrom #{source_pr}.\n\n"
          try:
              with open("CHANGELOG.md") as f:
                  existing = f.read()
          except FileNotFoundError:
              existing = "# Changelog\n\n"
          header, _, rest = existing.partition("\n\n")
          with open("CHANGELOG.md", "w") as f:
              f.write(header + "\n\n" + entry + rest)
          PYEOF

          git add extension/manifest.json CHANGELOG.md
          git commit -m "chore(release): v${VERSION}"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin main
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes "Released from #${SOURCE_PR} (${BUMP_TYPE}). See CHANGELOG.md."
